# docker-compose.yml — Levanta todo el sistema de microservicios localmente.
# Uso: make up  (o docker compose up --build -d)
#
# Servicios:
#   postgres      → Base de datos compartida (mientras migras a BD-por-servicio)
#   auth-service  → gRPC :50051
#   usuarios-svc  → gRPC :50052
#   cursos-svc    → gRPC :50053
#   lecciones-svc → gRPC :50054
#   examenes-svc  → gRPC :50055
#   foros-svc     → gRPC :50056
#   gateway       → HTTP :8080  ← API (JSON/gRPC fan-out)
#   frontend      → HTTP :80    ← SPA servida por Nginx
#
# Puerto de Postgres expuesto al host solo en el perfil "dev":
#   docker compose --profile dev up
#
# Producción (sin exponer Postgres):
#   docker compose up --build -d

services:

  # ── Infraestructura ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-capacitaciones}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio auxiliar que expone el puerto de Postgres al host.
  # Actívalo solo con: docker compose --profile dev up
  postgres-dev-proxy:
    image: postgres:16-alpine
    profiles: [dev]
    network_mode: "service:postgres"
    command: ["sh", "-c", "echo 'postgres port exposed on host:5432 (dev profile)' && tail -f /dev/null"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5432:5432"

  # Conversión de documentos a PDF (LibreOffice tras una API HTTP).
  #
  # Va en un contenedor aparte porque el gateway corre sobre distroless/static
  # (unos 2 MB) y meter LibreOffice dentro lo llevaría cerca de 1 GB.
  #
  # Es una dependencia dura de la emisión de constancias: sin él no se emiten.
  # Es deliberado — la alternativa sería entregar el .docx, que es la plantilla
  # oficial editable y justo lo que se quiere evitar.
  gotenberg:
    # Imagen propia, no la oficial a secas.
    #
    # La plantilla DC-3 está maquetada en Arial Narrow y la imagen oficial no
    # trae ningún sustituto métrico para esa fuente. El resultado eran campos
    # cortados a media letra y un documento de tres páginas donde deben ser dos.
    # Ver gotenberg/Dockerfile.
    build:
      context: .
      dockerfile: gotenberg/Dockerfile
    restart: unless-stopped
    # Sin `ports`: solo se le habla desde la red interna. Un Gotenberg accesible
    # desde fuera convierte cualquier documento que le manden y es un buen sitio
    # desde el que sondear la red interna.
    command:
      - "gotenberg"
      # 30s por defecto se queda corto en la primera conversión, que arranca
      # LibreOffice desde cero.
      - "--api-timeout=60s"
      # NO se toca --api-bind-ip: su valor por defecto (0.0.0.0) es el correcto.
      #
      # Se probó con `::` pensando que la red privada de Railway era IPv6-only.
      # No lo es: el DNS interno resuelve a IPv4, así que un Gotenberg escuchando
      # solo en IPv6 rechaza la conexión del gateway. El síntoma era un
      # "connection refused" con el nombre resolviendo perfectamente, que es de
      # los que más despistan porque parece un problema de red y es de binding.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:         postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:            "50051"
      JWT_SECRET:           ${JWT_SECRET}
      JWT_EXPIRY_HOURS:     ${JWT_EXPIRY_HOURS:-720}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Correo transaccional (Resend). Sustituye a SMTP_*.
      RESEND_API_KEY:       ${RESEND_API_KEY:-}
      RESEND_FROM:          ${RESEND_FROM:-}
      RESEND_REPLY_TO:      ${RESEND_REPLY_TO:-}
      EMAIL_VERIFICATION_TTL_MINUTES:      ${EMAIL_VERIFICATION_TTL_MINUTES:-15}
      EMAIL_VERIFICATION_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_COOLDOWN_SECONDS:-60}
      # SMTP_* quedan como respaldo de compatibilidad; ya no se usan para enviar.
      SMTP_FROM:            ${SMTP_FROM:-}
      APP_URL:              ${APP_URL:-http://localhost:5173}
      APP_NAME:             ${APP_NAME:-Capacitaciones}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
    expose:
      - "50051"

  # ── Usuarios service ──────────────────────────────────────────────────────────
  usuarios-service:
    build:
      context: .
      dockerfile: services/usuarios/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50052"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
    expose:
      - "50052"

  # ── Cursos service ────────────────────────────────────────────────────────────
  cursos-service:
    build:
      context: .
      dockerfile: services/cursos/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50053"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MENSAJES_ADDR: mensajes-service:50057
    expose:
      - "50053"

  # ── Lecciones service ─────────────────────────────────────────────────────────
  lecciones-service:
    build:
      context: .
      dockerfile: services/lecciones/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50054"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
    expose:
      - "50054"

  # ── Examenes service ──────────────────────────────────────────────────────────
  examenes-service:
    build:
      context: .
      dockerfile: services/examenes/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50055"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
    expose:
      - "50055"

  # ── Foros service ─────────────────────────────────────────────────────────────
  foros-service:
    build:
      context: .
      dockerfile: services/foros/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50056"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
    expose:
      - "50056"

  # ── Mensajes service ──────────────────────────────────────────────────────────
  mensajes-service:
    build:
      context: .
      dockerfile: services/mensajes/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-capacitaciones}?sslmode=disable
      GRPC_PORT:    "50057"
      LOG_LEVEL:    ${LOG_LEVEL:-info}
    expose:
      - "50057"

  # ── API Gateway ───────────────────────────────────────────────────────────────
  # Único contenedor expuesto al exterior. Recibe HTTP y hace fan-out a gRPC.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-service
      - usuarios-service
      - cursos-service
      - lecciones-service
      - examenes-service
      - foros-service
      - mensajes-service
      - gotenberg
    environment:
      PORT:           "8080"
      JWT_SECRET:     ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173,http://localhost:8080,http://localhost}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # Conversión de las constancias DC-3 a PDF. Sin esto no se emiten.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      # Base pública del sitio: se imprime en el pie de la constancia junto al
      # folio, para que quien la reciba sepa dónde comprobarla.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

      # Direcciones internas de los microservicios (resolución DNS de Docker)
      AUTH_ADDR:      auth-service:50051
      USUARIOS_ADDR:  usuarios-service:50052
      CURSOS_ADDR:    cursos-service:50053
      LECCIONES_ADDR: lecciones-service:50054
      EXAMENES_ADDR:  examenes-service:50055
      FOROS_ADDR:     foros-service:50056
      MENSAJES_ADDR:  mensajes-service:50057

      # Cloudflare R2
      R2_BUCKET:      ${R2_BUCKET:-}
      R2_ENDPOINT:    ${R2_ENDPOINT:-}
      R2_ACCESS_KEY:  ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY:  ${R2_SECRET_KEY:-}
      R2_PUBLIC_URL:  ${R2_PUBLIC_URL:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      GIN_MODE:       ${GIN_MODE:-release}
      LOG_LEVEL:      ${LOG_LEVEL:-info}

      # SMTP / Email para notificaciones DC-3
      # Correo transaccional (Resend). Sustituye a SMTP_*.
      RESEND_API_KEY:  ${RESEND_API_KEY:-}
      RESEND_FROM:     ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      SMTP_FROM:      ${SMTP_FROM:-}
      APP_URL:        ${APP_URL:-http://localhost:5173}
      APP_NAME:       ${APP_NAME:-Capacitaciones MH}

      # Videollamadas: el gateway firma los tokens con los que el cliente
      # entra a cada sala. Debe compartir JITSI_APP_SECRET con Prosody.
      JITSI_DOMAIN:     ${JITSI_DOMAIN:-localhost:8443}
      JITSI_APP_ID:     ${JITSI_APP_ID:-capacitaciones}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
    ports:
      - "8080:8080"

  # ── Frontend (Nginx SPA) ──────────────────────────────────────────────────────
  # Contenedor independiente que sirve los assets estáticos de Vue.
  # En producción puede reemplazarse por Cloudflare Pages / Vercel sin
  # tocar el gateway.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "80:80"
    depends_on:
      - gateway

  # ── Jitsi Meet (videollamadas) ────────────────────────────────────────────────
  #
  # Se autohospeda en lugar de usar meet.jit.si porque el servidor público
  # exige desde 2023 que el primer participante inicie sesión con una cuenta
  # Jitsi para abrir la sala — que es justamente la fricción del "código de
  # acceso" que queremos eliminar.
  #
  # La autenticación es por JWT: Prosody solo admite a quien presente un token
  # firmado con JITSI_APP_SECRET y cuyo claim `room` coincida con la sala. El
  # gateway emite ese token en POST /api/llamadas/token, y solo a quien el
  # gestor de llamadas reconoce como participante. Conocer el nombre de la
  # sala no basta para entrar.
  #
  # Estos cuatro contenedores son el despliegue de referencia de Jitsi:
  #   jitsi-web     → la interfaz y el servidor XMPP-sobre-WebSocket
  #   jitsi-prosody → XMPP: autenticación y salas
  #   jitsi-jicofo  → asigna un puente de vídeo a cada conferencia
  #   jitsi-jvb     → el puente que enruta el audio y vídeo
  #
  # Los secretos NUNCA van aquí: se generan una vez con `make jitsi-secrets`
  # y se guardan en .env.
  jitsi-prosody:
    image: jitsi/prosody:stable-9955
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - jitsi_prosody:/config
    environment:
      <<: &jitsi-comun
        TZ: ${TZ:-America/Mexico_City}
        XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
        XMPP_AUTH_DOMAIN: auth.${JITSI_XMPP_DOMAIN:-meet.jitsi}
        XMPP_MUC_DOMAIN: muc.${JITSI_XMPP_DOMAIN:-meet.jitsi}
        XMPP_INTERNAL_MUC_DOMAIN: internal-muc.${JITSI_XMPP_DOMAIN:-meet.jitsi}
        XMPP_SERVER: jitsi-prosody
        XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
        JICOFO_AUTH_USER: focus
        JVB_AUTH_USER: jvb
        JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
        JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
        JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      # Autenticación por token: sin esto Jitsi vuelve al modelo de sala
      # abierta y cualquiera con la URL entra.
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_APP_ID:-capacitaciones}
      JWT_APP_SECRET: ${JITSI_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JITSI_APP_ID:-capacitaciones}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_APP_ID:-capacitaciones}
      JWT_ALLOW_EMPTY: 0

  jitsi-web:
    image: jitsi/web:stable-9955
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "${JITSI_HTTP_PORT:-8000}:80"
      - "${JITSI_HTTPS_PORT:-8443}:443"
    volumes:
      - jitsi_web:/config
      - jitsi_web_crontabs:/var/spool/cron/crontabs
    environment:
      <<: *jitsi-comun
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://localhost:8443}
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      # La pantalla previa ("Entrar a la reunión") se desactiva en el servidor
      # y no solo desde el cliente: la clave `prejoinPageEnabled` que se usaba
      # en configOverwrite está obsoleta y meet.jit.si la ignoraba.
      ENABLE_PREJOIN_PAGE: 0
      ENABLE_WELCOME_PAGE: 0
      ENABLE_CLOSE_PAGE: 0
      DISABLE_DEEP_LINKING: 1
      ENABLE_LOBBY: 0
      # Habilitar Let's Encrypt en producción con un dominio real.
      ENABLE_LETSENCRYPT: ${JITSI_ENABLE_LETSENCRYPT:-0}
      LETSENCRYPT_DOMAIN: ${JITSI_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${JITSI_LETSENCRYPT_EMAIL:-}

  jitsi-jicofo:
    image: jitsi/jicofo:stable-9955
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    volumes:
      - jitsi_jicofo:/config
    environment:
      <<: *jitsi-comun

  jitsi-jvb:
    image: jitsi/jvb:stable-9955
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      # UDP 10000 es por donde viaja el audio y el vídeo. Si este puerto no
      # está abierto de extremo a extremo, la llamada conecta pero nadie ve ni
      # oye nada: es el fallo más común al desplegar Jitsi.
      - "${JVB_PORT:-10000}:10000/udp"
    volumes:
      - jitsi_jvb:/config
    environment:
      <<: *jitsi-comun
      JVB_PORT: ${JVB_PORT:-10000}
      # IP pública del host. En un servidor con NAT (la mayoría de VPS y
      # cualquier despliegue en la nube) hay que fijarla o el JVB anuncia una
      # dirección privada que los clientes no pueden alcanzar.
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:-}

volumes:
  postgres_data:
  jitsi_web:
  jitsi_web_crontabs:
  jitsi_prosody:
  jitsi_jicofo:
  jitsi_jvb:
