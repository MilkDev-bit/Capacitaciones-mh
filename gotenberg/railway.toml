# Configuración del servicio de conversión a PDF.
#
# Existe porque el railway.toml de la raíz NO es del gateway en exclusiva: se
# aplica a todo servicio desplegado desde este repositorio, y tiene prioridad
# sobre lo que se configure en el panel. El servicio de Gotenberg acababa
# construyendo gateway/Dockerfile y comprobando /api/health, así que el
# despliegue moría con "1/1 replicas never became healthy" pese a que la imagen
# se había construido sin errores.
#
# Para que Railway lea este fichero hay que indicárselo en el servicio:
#   Settings → Config-as-code → Railway Config File = gotenberg/railway.toml

[build]
builder        = "dockerfile"
dockerfilePath = "gotenberg/Dockerfile"

[deploy]
# SIN healthcheck, a propósito.
#
# Gotenberg expone /health, pero Railway sondea el puerto que él inyecta en
# PORT, no el 3000 que le fijamos con API_PORT. El resultado era un despliegue
# que se declaraba fallido —"1/1 replicas never became healthy"— con el proceso
# perfectamente arrancado y respondiendo.
#
# Se puede alinear poniendo API_PORT_FROM_ENV=PORT en el servicio, pero entonces
# el puerto lo elige Railway y hay que reflejarlo en el GOTENBERG_URL del
# gateway cada vez que cambie. Se prefiere un puerto fijo y conocido.
#
# La comprobación no se pierde, cambia de sitio y mejora: el gateway avisa al
# arrancar si falta GOTENBERG_URL, y /api/admin/diagnostico/gotenberg convierte
# la plantilla real y contesta qué fuente usó. Eso verifica el camino completo,
# no solo que el proceso conteste a un ping.
restartPolicyType       = "on_failure"
restartPolicyMaxRetries = 3
