<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Sustituciones para el formato DC-3.

  La plantilla oficial de la STPS está maquetada en Arial Narrow y Arial, con
  celdas de altura fija. Arial es propiedad de Microsoft y no se puede
  redistribuir en la imagen, así que se resuelven a las Liberation, que tienen
  las MISMAS métricas: mismo ancho de cada glifo y mismo alto de línea. Eso es
  lo que importa aquí; que el dibujo de la letra sea ligeramente distinto no
  altera dónde caen los saltos de línea ni de página.

  `binding="strong"` es deliberado: con el enlace débil, fontconfig puede
  descartar la sustitución si encuentra otra familia que le parezca más
  cercana por nombre, y "Arial Narrow" se parece a muchas.
-->
<fontconfig>

  <!--
    Dos candidatos en orden de preferencia. `prepend` los pone delante de la
    lista de la familia en vez de sustituirla, así que si el primero no está
    instalado fontconfig prueba el segundo y solo entonces cae al genérico.

    Con `assign` a una sola familia esto era frágil: bastaba con que el paquete
    de Liberation Narrow faltara —que es justo lo que pasó— para que la regla
    no sirviera de nada y Arial Narrow acabara en una fuente de ancho normal.

    Nimbus Sans Narrow es compatible métrica de Helvetica Narrow, y Arial es
    métricamente Helvetica, así que cualquiera de las dos conserva la
    maquetación del formato.
  -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans Narrow</string>
      <string>Nimbus Sans Narrow</string>
    </edit>
  </match>

  <!-- Arial ya lo cubre la imagen base, pero se declara por lo mismo que se
       instala fonts-liberation a mano: no depender de que la base no cambie. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
  </match>

</fontconfig>
