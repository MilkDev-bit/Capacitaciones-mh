syntax = "proto3";

package examenes;

option go_package = "Prueba-Go/gen/examenes;examenespb";

// ─────────────────────────────────────────────────────────────────────────────
// ExamenesService: gestión de exámenes, envío de respuestas y resultados.
// ─────────────────────────────────────────────────────────────────────────────
service ExamenesService {
  // ── Usuario autenticado ───────────────────────────────────────────────────
  rpc ListMisExamenes(UserRequest) returns (ListExamenesResponse);
  rpc GetExamen(ExamenUserRequest) returns (ExamenResponse);
  rpc SubmitExamen(SubmitRequest) returns (ResultadoResponse);

  // ── Instructor ────────────────────────────────────────────────────────────
  rpc InstructorListExamenes(UserRequest) returns (ListExamenesResponse);
  rpc InstructorCreateExamen(CreateExamenRequest) returns (ExamenResponse);
  // Trae el examen completo para editarlo, con `es_correcta` visible. GetExamen
  // no sirve: oculta las respuestas correctas porque es el que usa el alumno.
  rpc InstructorGetExamen(ExamenUserRequest) returns (ExamenResponse);
  rpc InstructorUpdateExamen(UpdateExamenRequest) returns (ExamenResponse);
  rpc InstructorDeleteExamen(ExamenRequest) returns (EmptyResponse);
  rpc InstructorGetResultados(ExamenRequest) returns (ListResultadosResponse);
  rpc InstructorGetRespuestasUsuario(RespuestasUsuarioRequest) returns (RespuestasResponse);

  // ── Admin ─────────────────────────────────────────────────────────────────
  rpc AdminListExamenes(EmptyRequest) returns (ListExamenesResponse);
  rpc AdminCreateExamen(CreateExamenRequest) returns (ExamenResponse);
  rpc AdminDeleteExamen(ExamenRequest) returns (EmptyResponse);
}

// ── Requests ─────────────────────────────────────────────────────────────────

message EmptyRequest   {}
message UserRequest    { string user_id  = 1; }
message ExamenRequest  { string examen_id = 1; }

message ExamenUserRequest {
  string examen_id = 1;
  string user_id   = 2;
}

message CreateExamenRequest {
  string          user_id         = 1; // instructor/admin
  string          title           = 2;
  string          description     = 3;
  string          capacitacion_id = 4;
  repeated PreguntaInput preguntas = 5;
}

// UpdateExamenRequest reemplaza el contenido de un examen conservando lo que no
// cambia.
//
// Las preguntas que llegan CON id se actualizan en su sitio; las que llegan sin
// id son nuevas; las que existían y no vienen en la lista se borran. Esto
// importa por el esquema:
//
//     respuestas_examen.pregunta_id REFERENCES preguntas(id) ON DELETE CASCADE
//
// Borrar y reinsertar todas las preguntas en cada guardado —que es lo más fácil
// de programar— se llevaría por delante las respuestas de todo el que ya
// presentó el examen. En una plataforma que emite constancias DC-3, eso es
// destruir la evidencia de que alguien aprobó.
message UpdateExamenRequest {
  string          examen_id       = 1;
  string          user_id         = 2; // instructor; se comprueba la propiedad
  string          title           = 3;
  string          description     = 4;
  string          capacitacion_id = 5;
  repeated PreguntaInput preguntas = 6;
}

message PreguntaInput {
  string texto  = 1;
  string tipo   = 2; // "opcion_multiple" | "verdadero_falso" | "abierta"
  double valor  = 3;
  int32  orden  = 4;
  repeated OpcionInput opciones = 5;
  // Vacío al crear. Al editar, identifica una pregunta que ya existe para
  // actualizarla en lugar de sustituirla, y así no perder sus respuestas.
  string id     = 6;
}

message OpcionInput {
  string texto       = 1;
  bool   es_correcta = 2;
  // Igual que en la pregunta: conservar el id evita que una respuesta ya
  // registrada apunte a una opción que dejó de existir.
  string id          = 3;
}

message SubmitRequest {
  string examen_id              = 1;
  string user_id                = 2;
  repeated RespuestaInput respuestas = 3;
}

message RespuestaInput {
  string pregunta_id      = 1;
  string opcion_id        = 2;
  string respuesta_texto  = 3;
}

message RespuestasUsuarioRequest {
  string examen_id = 1;
  string user_id   = 2;
}

// ── Responses ────────────────────────────────────────────────────────────────

message ExamenResponse {
  string            id              = 1;
  string            title           = 2;
  string            description     = 3;
  string            instructor_id   = 4;
  string            capacitacion_id = 5;
  string            created_at      = 6;
  repeated Pregunta preguntas       = 7;
  bool              ya_respondido   = 8;
  double            porcentaje      = 9;
}

message Pregunta {
  string          id       = 1;
  string          texto    = 2;
  string          tipo     = 3;
  double          valor    = 4;
  int32           orden    = 5;
  repeated Opcion opciones = 6;
  // Cuántas personas ya respondieron esta pregunta. Solo se rellena al pedir el
  // examen para editarlo: es lo que permite avisar antes de guardar de que
  // quitarla borrará ese historial.
  int32           respuestas = 7;
}

message Opcion {
  string id          = 1;
  string texto       = 2;
  bool   es_correcta = 3; // solo visible para instructor/admin
}

message ListExamenesResponse {
  repeated ExamenResponse examenes = 1;
}

message ResultadoResponse {
  string examen_id   = 1;
  string titulo      = 2;
  double puntaje     = 3;
  double puntaje_max = 4;
  double porcentaje  = 5;
}

message ResultadoUsuario {
  string user_id    = 1;
  string user_name  = 2;
  double puntaje    = 3;
  double porcentaje = 4;
  string submitted_at = 5;
}

message ListResultadosResponse {
  repeated ResultadoUsuario resultados = 1;
}

message RespuestaDetalle {
  string pregunta_id      = 1;
  string pregunta_texto   = 2;
  string opcion_id        = 3;
  string respuesta_texto  = 4;
  bool   es_correcta      = 5;
}

message RespuestasResponse {
  repeated RespuestaDetalle respuestas = 1;
  double puntaje     = 2;
  double porcentaje  = 3;
}

message EmptyResponse {}
