syntax = "proto3";

package cursos;

option go_package = "Prueba-Go/gen/cursos;cursospb";

// ─────────────────────────────────────────────────────────────────────────────
// CursosService: gestión de capacitaciones, inscripciones y asignaciones.
// ─────────────────────────────────────────────────────────────────────────────
service CursosService {
  // ── Público ──────────────────────────────────────────────────────────────
  rpc PreviewCurso(CodigoRequest) returns (CursoResponse);
  rpc GetCursoPublico(CursoIDRequest) returns (CursoResponse);
  rpc ListCursosPublicos(EmptyRequest) returns (ListCursosResponse);

  // ── Usuario autenticado ───────────────────────────────────────────────────
  rpc ListMisCapacitaciones(UserRequest) returns (ListCursosResponse);
  rpc GetCurso(CursoIDRequest) returns (CursoResponse);
  rpc Inscribirse(InscribirseRequest) returns (EmptyResponse);
  // Devuelve el curso al que se acaba de unir, no EmptyResponse.
  //
  // El repositorio ya lo tenía —resuelve el código a un curso para poder
  // inscribir— y el servicio lo descartaba. El precio de tirarlo era doble: el
  // mensaje de confirmación decía «Te uniste a "undefined"», y la notificación
  // enlazaba al listado en vez de al curso, porque tampoco había id.
  rpc UnirseConCodigo(UnirseRequest) returns (CursoResponse);
  rpc UnirseConLicencia(UnirseConLicenciaRequest) returns (EmptyResponse);
  // Los webhooks devuelven el detalle de lo comprado (no EmptyResponse) porque
  // el Gateway necesita esos datos para construir el correo de confirmación y
  // la pantalla de éxito sin hacer una segunda ronda de consultas.
  rpc WebhookEnroll(WebhookEnrollRequest) returns (EnrollResponse);
  rpc WebhookComprarLicencia(WebhookComprarLicenciaRequest) returns (EmptyResponse);
  rpc WebhookComprarB2BDirect(WebhookComprarB2BDirectRequest) returns (ComprarB2BDirectResponse);

  // Reparto de accesos corporativos por correo.
  rpc AsignarAccesosLicencia(AsignarAccesosLicenciaRequest) returns (AsignarAccesosLicenciaResponse);
  rpc ListInvitacionesLicencia(LicenciaIDRequest) returns (ListInvitacionesLicenciaResponse);

  // Registra que un participante terminó el curso y decide si toca avisar al
  // representante de su licencia para que tramite las constancias DC-3.
  // La deduplicación vive en la BD: solo devuelve avisar=true la primera vez.
  rpc NotificarCursoCompletado(CursoCompletadoRequest) returns (CursoCompletadoResponse);
  // Deduplicación de webhooks de Stripe. Devuelve primera_vez=false si el
  // evento ya se había procesado: la entrega es al-menos-una-vez.
  rpc RegistrarEventoStripe(EventoStripeRequest) returns (EventoStripeResponse);
  // Transición de estado de una orden tras el resultado del cobro.
  rpc ActualizarEstadoOrden(ActualizarEstadoOrdenRequest) returns (EmptyResponse);

  // ── Suscripciones ─────────────────────────────────────────────────────────
  rpc ListPlanes(EmptyRequest) returns (ListPlanesResponse);
  rpc GetMiSuscripcion(UserRequest) returns (SuscripcionResponse);
  rpc CrearCheckoutSuscripcion(CheckoutSuscripcionRequest) returns (CheckoutSessionResponse);
  // Aplica el estado que reporta Stripe. Nunca se infiere localmente: el
  // ciclo de vida lo manda el PSP.
  rpc SincronizarSuscripcion(SincronizarSuscripcionRequest) returns (EmptyResponse);
  rpc RegistrarFacturaSuscripcion(FacturaSuscripcionRequest) returns (EmptyResponse);
  // Acceso derivado de una suscripción viva (titular o asiento ocupado).
  rpc TieneAccesoPorSuscripcion(UserRequest) returns (AccesoSuscripcionResponse);
  rpc AsignarAsientos(AsignarAsientosRequest) returns (ListAsientosResponse);
  rpc ListAsientos(SuscripcionIDRequest) returns (ListAsientosResponse);
  rpc RevocarAsiento(RevocarAsientoRequest) returns (EmptyResponse);

  rpc CreateCheckoutSession(CheckoutSessionRequest) returns (CheckoutSessionResponse);
  rpc CreateCheckoutSessionB2BDirect(CreateCheckoutSessionB2BDirectRequest) returns (CheckoutSessionResponse);
  rpc CreateCheckoutSessionCart(CheckoutCartRequest) returns (CheckoutSessionResponse);
  rpc ListLicencias(ListLicenciasRequest) returns (ListLicenciasResponse);
  rpc GetLicenciaPublica(LicenciaIDRequest) returns (LicenciaPublicaResponse);
  rpc ListLicenciasCompradas(UserRequest) returns (ListLicenciasResponse);

  // ── Instructor ────────────────────────────────────────────────────────────
  rpc InstructorListCapacitaciones(UserRequest) returns (ListCursosResponse);
  rpc InstructorCreateCapacitacion(CreateCursoRequest) returns (CursoResponse);
  rpc InstructorUpdateCapacitacion(UpdateCursoRequest) returns (CursoResponse);
  rpc InstructorDeleteCapacitacion(CursoIDRequest) returns (EmptyResponse);
  rpc InstructorTogglePublic(CursoIDRequest) returns (CursoResponse);
  rpc InstructorResetCodigo(CursoIDRequest) returns (CursoResponse);
  rpc InstructorListEstudiantes(UserRequest) returns (ListEstudiantesResponse);
  rpc InstructorAsignar(AsignarRequest) returns (EmptyResponse);
  
  rpc InstructorCreateLicencia(CreateLicenciaRequest) returns (Licencia);
  rpc InstructorUpdateLicencia(UpdateLicenciaRequest) returns (Licencia);
  rpc InstructorDeleteLicencia(LicenciaIDRequest) returns (EmptyResponse);

  // ── Admin ─────────────────────────────────────────────────────────────────
  rpc AdminListCapacitaciones(EmptyRequest) returns (ListCursosResponse);
  rpc AdminCreateCapacitacion(CreateCursoRequest) returns (CursoResponse);
  rpc AdminUpdateCapacitacion(UpdateCursoRequest) returns (CursoResponse);
  rpc AdminDeleteCapacitacion(CursoIDRequest) returns (EmptyResponse);
  rpc AdminResetCodigo(CursoIDRequest) returns (CursoResponse);
  rpc AdminListAsignaciones(EmptyRequest) returns (ListAsignacionesResponse);
  rpc AdminAsignar(AsignarRequest) returns (EmptyResponse);
  rpc AdminDesAsignar(AsignacionIDRequest) returns (EmptyResponse);

  // Obtiene estadísticas del dashboard de ventas y ganancias (solo admin)
  rpc GetAdminDashboardStats(EmptyRequest) returns (AdminDashboardStatsResponse);

  // Panel financiero. Sale de `ordenes` y `suscripcion_facturas`, que es lo que
  // se cobró de verdad, y no del precio de catálogo.
  rpc GetFinanzasAdmin(EmptyRequest) returns (FinanzasAdminResponse);
  // Licencias agrupadas por empresa compradora, para la pantalla de admin.
  rpc AdminListLicenciasEmpresas(EmptyRequest) returns (AdminListLicenciasEmpresasResponse);

  // Relleno del histórico de comisiones. El servicio devuelve qué cobros
  // siguen sin comisión y el gateway, que es quien habla con Stripe, la
  // consulta y la devuelve por RegistrarComisionOrden.
  rpc ListOrdenesSinComision(ListOrdenesSinComisionRequest) returns (ListOrdenesSinComisionResponse);
  rpc RegistrarComisionOrden(RegistrarComisionOrdenRequest) returns (EmptyResponse);

  // ── Constancias DC-3 ──────────────────────────────────────────────────────
  //
  // La constancia se arma con tres orígenes: los datos del trabajador (los
  // captura el alumno una vez), los de la empresa y el curso (los captura el
  // instructor en la capacitación) y la fecha de término (la pone el sistema).
  //
  // GetDatosDC3 devuelve todo junto ya resuelto para que el Gateway solo tenga
  // que generar el documento, sin conocer el modelo del foro de datos.
  rpc GetDatosDC3(DatosDC3Request)            returns (DatosDC3Response);
  rpc GuardarDatosTrabajador(DatosTrabajadorRequest) returns (EmptyResponse);
  rpc RegistrarConstanciaDC3(RegistrarConstanciaRequest) returns (EmptyResponse);
  rpc ListMisConstancias(UserRequest)         returns (ListConstanciasResponse);
  // Consulta pública por folio. No requiere sesión: la usa quien recibe una
  // constancia en papel y quiere comprobar que existe.
  rpc VerificarConstancia(VerificarConstanciaRequest) returns (VerificarConstanciaResponse);

  // Empresa por defecto del instructor: la que se usa cuando el alumno no
  // declara patrón propio. Se captura una vez y sirve para todos sus cursos.
  rpc GetEmpresaInstructor(UserRequest)              returns (DatosEmpresaDC3);
  rpc GuardarEmpresaInstructor(EmpresaInstructorRequest) returns (EmptyResponse);
}

// ── Requests ─────────────────────────────────────────────────────────────────

message EmptyRequest  {}
message UserRequest   { string user_id = 1; }
message CursoIDRequest {
  string curso_id = 1;
  string user_id = 2;
}
message CodigoRequest { string codigo = 1; }
message AsignacionIDRequest { string asignacion_id = 1; }

message CreateCursoRequest {
  string user_id         = 1; // instructor o admin que lo crea
  string title           = 2;
  string description     = 3;
  string type            = 4;
  string content         = 5;
  string file_path       = 6;
  bool   is_public       = 7;
  string welcome_message = 8;
  string thumbnail_url   = 9;
  string color           = 10;
  double precio          = 11;
  string scheduled_at    = 12;
  int32  duration        = 13;
  bool   dc3_enabled     = 14;
  // Área temática del catálogo STPS. Es del curso: "trabajos en altura" y
  // "primeros auxilios" no comparten clave, así que no puede vivir en el perfil
  // del instructor.
  string dc3_area_tematica = 15;
  // Nombre OFICIAL del curso para la constancia.
  //
  // No es el título comercial: "Curso Trabajos en alturas" se vende así, pero
  // en la DC-3 figura "SEGURIDAD EN TRABAJOS ALTURAS". Vacío usa el título.
  string dc3_nombre_curso = 16;
  // Duración OFICIAL en horas que declara la constancia.
  //
  // Deliberadamente separada de `duration`, que son minutos de contenido en la
  // plataforma. Son cifras distintas: un curso con 95 minutos de vídeo puede
  // ser legalmente una capacitación de 8 horas según el catálogo STPS. Derivarla
  // de `duration` habría puesto "2 h" en un documento oficial que debe decir 8.
  int32 dc3_duracion_horas = 17;
}

message UpdateCursoRequest {
  string curso_id        = 1;
  string user_id         = 2;
  string title           = 3;
  string description     = 4;
  string type            = 5;
  string content         = 6;
  string file_path       = 7;
  bool   is_public       = 8;
  string welcome_message = 9;
  string thumbnail_url   = 10;
  string color           = 11;
  double precio          = 12;
  string scheduled_at    = 13;
  int32  duration        = 15;
  bool   dc3_enabled     = 16;
  string dc3_area_tematica = 17;
  string dc3_nombre_curso  = 18;
  // Horas oficiales de la constancia. Ver CreateCursoRequest.
  int32  dc3_duracion_horas = 19;
}

message InscribirseRequest {
  string user_id  = 1;
  string curso_id = 2;
}

message UnirseRequest {
  string user_id = 1;
  string codigo  = 2;
}

message AsignarRequest {
  string requester_id     = 1; // quien asigna (instructor o admin)
  string target_user_id   = 2;
  string capacitacion_id  = 3;
  string examen_id        = 4;
}

// ── Responses ────────────────────────────────────────────────────────────────

message CursoResponse {
  string id              = 1;
  string title           = 2;
  string description     = 3;
  string type            = 4;
  string file_path       = 5;
  string content         = 6;
  string instructor_id   = 7;
  bool   is_public       = 8;
  string codigo_acceso   = 9;
  string welcome_message = 10;
  string thumbnail_url   = 11;
  string color           = 12;
  string created_at      = 13;
  double precio          = 14;
  string scheduled_at    = 15;
  int32  duration        = 17;
  int32  total_lecciones = 18;
  int32  lecciones_completadas = 19;
  bool   dc3_enabled     = 20;
  string dc3_area_tematica = 21;
  string dc3_nombre_curso  = 22;
  int32  dc3_duracion_horas = 23;
}

message ListCursosResponse {
  repeated CursoResponse cursos = 1;
}

message EstudianteInfo {
  string user_id    = 1;
  string name       = 2;
  string email      = 3;
  string assigned_at = 4;
}

message ListEstudiantesResponse {
  repeated EstudianteInfo estudiantes = 1;
}

message AsignacionInfo {
  string id              = 1;
  string user_id         = 2;
  string user_name       = 3;
  string capacitacion_id = 4;
  string examen_id       = 5;
  string assigned_at     = 6;
}

message ListAsignacionesResponse {
  repeated AsignacionInfo asignaciones = 1;
}

message EmptyResponse {}

message Licencia {
  string id = 1;
  string capacitacion_id = 2;
  string nombre = 3;
  double precio = 4;
  int32 capacidad_maxima = 5;
  int32 usadas = 6;
  string codigo_acceso = 7;
  string stripe_product_id = 8;
  string stripe_price_id = 9;
  string comprador_id = 10;
  string created_at = 11;
  string curso_type = 12;
  int32 curso_duracion = 13;
  // Título de la capacitación asociada — evita que el frontend haga N+1 fetches.
  string capacitacion_titulo = 14;
  // Accesos ya repartidos por correo (invitaciones enviadas).
  int32 accesos_enviados = 15;
}

message LicenciaPublicaResponse {
  string id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
  string capacitacion_id = 5;
  string capacitacion_titulo = 6;
  string capacitacion_thumbnail = 7;
}

message CreateLicenciaRequest {
  string capacitacion_id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
  string instructor_id = 5; // used to auto-add as group admin
}

message UpdateLicenciaRequest {
  string id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
}

message LicenciaIDRequest {
  string id = 1;
}

message ListLicenciasRequest {
  string capacitacion_id = 1;
}

message ListLicenciasResponse {
  repeated Licencia licencias = 1;
}

message UnirseConLicenciaRequest {
  string user_id = 1;
  string capacitacion_id = 2;
  string codigo_acceso = 3;
}

message WebhookEnrollRequest {
  string user_id = 1;
  string capacitacion_id = 2;
  string licencia_id = 3;
}

message CartItem {
  string curso_id = 1;
  int32 cantidad = 2;
  string type = 3; // "b2c" | "b2b_direct"
}

message CheckoutCartRequest {
  string user_id = 1;
  repeated CartItem items = 2;
  string success_url = 3;
  string cancel_url = 4;
}

message WebhookComprarLicenciaRequest {
  string user_id = 1;
  string licencia_id = 2;
}

message CheckoutSessionRequest {
  string user_id = 1;
  string licencia_id = 2; // optional, used for B2B payment flow (if still supported)
  string success_url = 3;
  string cancel_url = 4;
  string curso_id = 5; // optional, used for individual B2C course purchase
}

message CheckoutSessionResponse {
  string url = 1;
  // Id de la orden creada antes de redirigir a Stripe. Permite rastrear el
  // intento de cobro aunque el usuario nunca vuelva.
  string orden_id = 2;
}

// ── Suscripciones ────────────────────────────────────────────────────────────

message Plan {
  string id              = 1;
  string codigo          = 2;
  string nombre          = 3;
  string descripcion     = 4;
  string modalidad       = 5;  // "individual" | "asientos"
  string intervalo       = 6;  // "mes" | "anio"
  int64  precio_centavos = 7;  // por asiento cuando modalidad="asientos"
  string moneda          = 8;
  int32  dias_prueba     = 9;
  bool   activo          = 10;
}

message ListPlanesResponse {
  repeated Plan planes = 1;
}

message SuscripcionResponse {
  string id         = 1;
  string plan_id    = 2;
  string plan_nombre = 3;
  string modalidad  = 4;
  string intervalo  = 5;
  int64  precio_centavos = 6;
  // incompleta | en_prueba | activa | vencida | cancelada | impagada
  string estado     = 7;
  int32  asientos   = 8;
  int32  asientos_ocupados = 9;
  string periodo_inicio = 10;
  string periodo_fin    = 11;
  string prueba_fin     = 12;
  bool   cancelar_al_terminar = 13;
  // true mientras el acceso siga vivo, incluido el periodo de gracia.
  bool   acceso_vigente = 14;
  // Necesario para abrir el Billing Portal. El Gateway NO lo reenvía al
  // navegador: se usa solo para firmar la sesión del portal.
  string stripe_customer_id = 15;
}

message CheckoutSuscripcionRequest {
  string user_id     = 1;
  string plan_codigo = 2;
  int32  asientos    = 3;
  string success_url = 4;
  string cancel_url  = 5;
}

message SincronizarSuscripcionRequest {
  string stripe_subscription_id = 1;
  string stripe_customer_id     = 2;
  string user_id                = 3;  // solo en el alta inicial
  string plan_codigo            = 4;  // solo en el alta inicial
  string estado                 = 5;  // estado ya traducido desde Stripe
  int32  asientos               = 6;
  string periodo_inicio         = 7;  // RFC3339
  string periodo_fin            = 8;
  string prueba_fin             = 9;
  bool   cancelar_al_terminar   = 10;
}

message FacturaSuscripcionRequest {
  string stripe_subscription_id = 1;
  string stripe_invoice_id      = 2;
  string estado                 = 3;  // pagada | fallida | abierta
  int64  total_centavos         = 4;
  string moneda                 = 5;
  int32  intento_cobro          = 6;
  string url_pdf                = 7;
  string periodo_inicio         = 8;
  string periodo_fin            = 9;

  // Mismo criterio que en la orden: la comisión la dicta Stripe, no un
  // porcentaje nuestro.
  bool   comision_conocida      = 10;
  int64  comision_centavos      = 11;
  int64  neto_centavos          = 12;
  string balance_transaction_id = 13;
}

message AccesoSuscripcionResponse {
  bool   tiene_acceso   = 1;
  string origen         = 2;  // "titular" | "asiento" | ""
  string suscripcion_id = 3;
  string estado         = 4;
}

message ParticipanteAsiento {
  string nombre = 1;
  string email  = 2;
}

message AsignarAsientosRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
  repeated ParticipanteAsiento participantes = 3;
}

message SuscripcionIDRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
}

message RevocarAsientoRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
  string email          = 3;
}

message Asiento {
  string id     = 1;
  string email  = 2;
  string user_id = 3;
  string estado = 4;  // invitado | activo | revocado
  string invitado_at = 5;
}

message ListAsientosResponse {
  repeated Asiento asientos = 1;
  int32 total     = 2;
  int32 ocupados  = 3;
  int32 libres    = 4;
}

// ── Órdenes y webhooks ───────────────────────────────────────────────────────

message EventoStripeRequest {
  string event_id = 1;
  string tipo     = 2;
}

message EventoStripeResponse {
  // false cuando el evento ya estaba registrado (reenvío de Stripe).
  bool primera_vez = 1;
}

message ActualizarEstadoOrdenRequest {
  string stripe_session_id     = 1;
  string estado                = 2; // 'pagada' | 'cumplida' | 'fallida'
  string motivo_fallo          = 3;
  string stripe_payment_intent = 4;

  // Lo que Stripe se quedó, tal como lo reporta el BalanceTransaction del
  // cobro. No se calcula aquí: las tarifas cambian por método de pago (OXXO,
  // tarjeta internacional, MSI) y llevan IVA.
  //
  // `comision_conocida` distingue "todavía no se ha consultado" de "se
  // consultó y fue cero". Sin esa bandera, un cero se guardaría como si Stripe
  // no hubiera cobrado nada e inflaría la ganancia neta.
  bool   comision_conocida     = 5;
  int64  comision_centavos     = 6;
  int64  neto_centavos         = 7;
  string balance_transaction_id = 8;
}

message AdminDashboardStatsResponse {
  float total_ventas_brutas = 1;
  float total_ventas_netas = 2; // Brutas descontando tarifas Stripe aproximadas (3.6% + 3 MXN)
  int32 total_transacciones = 3;
  int32 licencias_vendidas = 4;
  int32 compras_individuales = 5;
}

message CreateCheckoutSessionB2BDirectRequest {
  string user_id = 1;
  string curso_id = 2;
  int32 cantidad = 3;
  string success_url = 4;
  string cancel_url = 5;
}

message WebhookComprarB2BDirectRequest {
  string user_id = 1;
  string curso_id = 2;
  int32 cantidad = 3;
}


// ── Resultado de una compra (para correo de confirmación y pantalla de éxito) ─

message EnrollResponse {
  string capacitacion_id     = 1;
  string capacitacion_titulo = 2;
  string capacitacion_type   = 3; // "video" | "document" | "text" | "link"
  // Dueño del curso. El Gateway lo usa para avisarle de la nueva inscripción;
  // va vacío en los cursos sin instructor asignado.
  string instructor_id       = 4;
}

message ComprarB2BDirectResponse {
  string licencia_id         = 1;
  string capacitacion_id     = 2;
  string capacitacion_titulo = 3;
  string capacitacion_type   = 4;
  // codigo_acceso se usa en cursos asíncronos (un código compartido).
  string codigo_acceso       = 5;
  int32  lugares             = 6;
  double total               = 7;
}

// ── Reparto de accesos a participantes ───────────────────────────────────────

message ParticipanteInput {
  string nombre = 1;
  string email  = 2;
}

message AsignarAccesosLicenciaRequest {
  string licencia_id  = 1;
  string comprador_id = 2; // se valida contra curso_licencias.comprador_id
  repeated ParticipanteInput participantes = 3;
}

message AccesoParticipante {
  string nombre              = 1;
  string email               = 2;
  string codigo              = 3;
  string capacitacion_id     = 4;
  string capacitacion_titulo = 5;
  string capacitacion_type   = 6;
}

message AsignarAccesosLicenciaResponse {
  repeated AccesoParticipante accesos = 1;
}

message InvitacionLicencia {
  string id          = 1;
  string licencia_id = 2;
  string nombre      = 3;
  string email       = 4;
  string codigo      = 5;
  string estado      = 6; // "enviado" | "usado"
  string enviado_at  = 7;
}

message ListInvitacionesLicenciaResponse {
  repeated InvitacionLicencia invitaciones = 1;
}

// ── Aviso DC-3 al representante ──────────────────────────────────────────────

message CursoCompletadoRequest {
  string user_id         = 1;
  string capacitacion_id = 2;
}

message CursoCompletadoResponse {
  // false cuando no aplica: compra individual sin licencia, curso con DC-3
  // desactivado, o aviso ya enviado antes.
  bool   avisar              = 1;
  string representante_id    = 2;
  string capacitacion_titulo = 3;
  int32  duracion_minutos    = 4;
}














// ── Constancias DC-3 ─────────────────────────────────────────────────────────

// DatosEmpresaDC3 identifica al patrón y a los agentes que firman la constancia.
//
// Se usa en dos sitios con el mismo formato: la empresa que declara el alumno
// (su patrón real) y la que el instructor deja configurada como respaldo. En la
// generación gana la del alumno; la del instructor solo entra si el alumno no
// declaró ninguna.
message DatosEmpresaDC3 {
  string razon_social                = 1;
  string rfc                         = 2;
  // Agentes que firman: el patrón o su representante legal, y el
  // representante de los trabajadores.
  string nombre_patron               = 3;
  string representante_trabajadores  = 4;
  // area_tematica ya NO se usa aquí: es un atributo del curso, no de la
  // empresa. Se conserva el número de campo para no reciclarlo.
  reserved 5;
  // Capacitador acreditado que imparte. Es del instructor, no del patrón.
  string nombre_capacitador          = 6;
  // Logo de la empresa, como URL de R2.
  //
  // La cabecera de la constancia lleva DOS logotipos: este y un sello del
  // formato oficial que NUNCA se sustituye. Vacío deja el de la plantilla.
  //
  // Se guarda la URL y no la imagen en base64: una imagen de 1 MB serían ~1.4 MB
  // de texto en cada fila, y el resto de la plataforma ya sube a R2.
  string logo_url                    = 7;
}

// DatosTrabajadorDC3 lo captura el alumno al terminar su primer curso con
// constancia y se reutiliza en las siguientes.
message DatosTrabajadorDC3 {
  string curp                 = 1;
  string puesto               = 2;
  string ocupacion_especifica = 3;
  // Logotipo de la empresa del alumno, para el lado IZQUIERDO de la constancia.
  //
  // Solo tiene sentido si declara empresa propia: ese lado es del patrón. Quien
  // no la declara recibe el logotipo del instructor en ambos lados, porque
  // entonces el patrón que figura en el documento es el suyo.
  string logo_url             = 4;
}

message DatosTrabajadorRequest {
  string user_id = 1;
  DatosTrabajadorDC3 datos = 2;
  // Patrón del alumno. Opcional: quien no tenga empresa lo deja vacío y la
  // constancia sale a nombre de la que configuró el instructor.
  //
  // Se acepta el bloque COMPLETO o ninguno. Mezclar la razón social del alumno
  // con el representante de los trabajadores del instructor produciría un
  // documento que no corresponde a ninguna empresa real.
  DatosEmpresaDC3 empresa = 3;
}

message EmpresaInstructorRequest {
  string instructor_id = 1;
  DatosEmpresaDC3 empresa = 2;
}

message DatosDC3Request {
  string user_id        = 1;
  string capacitacion_id = 2;
}

// DatosDC3Response trae todo lo necesario para generar el documento, más el
// diagnóstico de qué falta y a quién le toca completarlo.
message DatosDC3Response {
  // Empresa ya resuelta: la del alumno si la declaró, si no la del instructor.
  DatosEmpresaDC3    empresa    = 1;
  DatosTrabajadorDC3 trabajador = 2;

  string nombre_curso   = 3;
  string duracion_horas = 4;
  // Fechas en YYYY-MM-DD. El inicio es la inscripción y el fin la fecha en que
  // se completó el curso: es lo que la constancia declara como periodo.
  string fecha_inicio = 5;
  string fecha_fin    = 6;

  // Falsos cuando el instructor o el alumno todavía no capturaron lo suyo. El
  // frontend los usa para saber a quién pedirle los datos en lugar de mostrar
  // un error genérico.
  bool empresa_completa    = 7;
  bool trabajador_completo = 8;
  // URL de una constancia ya emitida; vacía si aún no se ha generado.
  string constancia_url = 9;
  // "alumno" o "instructor": de dónde salió la empresa resuelta. El frontend lo
  // usa para decirle al alumno a nombre de quién va a salir su constancia, que
  // es justo lo que necesita saber para decidir si declara su propio patrón.
  string empresa_origen = 10;
  // Área temática del curso (catálogo STPS). Vive en la capacitación.
  string area_tematica = 11;

  // Logotipos ya resueltos para la cabecera, para que el Gateway no tenga que
  // repetir aquí la regla de precedencia entre alumno e instructor.
  //
  //   logo_patron_url       → izquierda: la empresa que emplea al trabajador
  //   logo_capacitador_url  → derecha:   quien imparte la capacitación
  //
  // Coinciden cuando el alumno no declara empresa propia, porque entonces el
  // patrón que figura en el documento es el del instructor.
  string logo_patron_url      = 12;
  string logo_capacitador_url = 13;
}

message RegistrarConstanciaRequest {
  string user_id         = 1;
  string capacitacion_id = 2;
  string archivo_url     = 3;
  // Código único impreso en el documento. Es lo que permite distinguir una
  // constancia emitida por nosotros de un PDF editado: el folio de la falsa no
  // existe en la base.
  string folio           = 4;
  // Nombre y empresa tal como salieron impresos. Se guardan congelados para que
  // la verificación confirme lo que dice el papel, no lo que diga el perfil del
  // alumno meses después.
  string nombre_trabajador = 5;
  string razon_social      = 6;
}

message VerificarConstanciaRequest { string folio = 1; }

// VerificarConstanciaResponse es PÚBLICA: la sirve un endpoint sin sesión.
//
// Por eso lleva lo justo para confirmar que la constancia es real —a nombre de
// quién, de qué curso y de cuándo— y ni un dato más. Nada de CURP, RFC, correo
// ni identificadores internos: quien teclea un folio ajeno no debe obtener el
// expediente de esa persona.
message VerificarConstanciaResponse {
  bool   valida              = 1;
  string nombre_trabajador   = 2;
  string capacitacion_titulo = 3;
  string razon_social        = 4;
  string generada_at         = 5;
}

message ConstanciaDC3 {
  string capacitacion_id     = 1;
  string capacitacion_titulo = 2;
  string archivo_url         = 3;
  string generada_at         = 4;
  // Vacío en las constancias emitidas antes de la verificación pública.
  string folio               = 5;
}

message ListConstanciasResponse {
  repeated ConstanciaDC3 constancias = 1;
}


// ─────────────────────────────────────────────────────────────────────────────
// Panel financiero (solo admin)
// ─────────────────────────────────────────────────────────────────────────────

// Importes SIEMPRE en centavos y en enteros.
//
// El resto del panel usaba `float` y arrastraba el error de coma flotante hasta
// la pantalla de la directiva. Un centavo perdido por redondeo en cada orden se
// nota al sumar un año de ventas.
message FinanzasAdminResponse {
  int64 bruto_centavos    = 1;
  int64 comision_centavos = 2;
  int64 neto_centavos     = 3;
  string moneda           = 4;

  int32 transacciones     = 5;

  // Cobros ya liquidados a los que todavía no se les ha traído la comisión de
  // Stripe. Mientras esto no sea cero, el neto de arriba es un piso, no la
  // cifra final, y la pantalla tiene que decirlo.
  int32 sin_comision      = 6;

  repeated PuntoMensual   serie         = 7;
  repeated TransaccionFin transacciones_recientes = 8;
}

message PuntoMensual {
  string mes              = 1; // AAAA-MM
  int64  bruto_centavos   = 2;
  int64  comision_centavos = 3;
  int64  neto_centavos    = 4;
}

message TransaccionFin {
  string id               = 1;
  string cliente          = 2;
  string email            = 3;
  string fecha            = 4; // RFC3339
  int64  bruto_centavos   = 5;
  int64  comision_centavos = 6;
  int64  neto_centavos    = 7;
  bool   comision_conocida = 8;
  // 'curso' para una compra suelta, 'suscripcion' para un cobro recurrente.
  string origen           = 9;
  string concepto         = 10;
}

// ─────────────────────────────────────────────────────────────────────────────
// Empresas / Licencias (solo admin)
// ─────────────────────────────────────────────────────────────────────────────

message AdminLicenciaEmpresa {
  string id                  = 1;
  string nombre              = 2;
  string capacitacion_id     = 3;
  string capacitacion_titulo = 4;
  string comprador_id        = 5;
  string comprador_nombre    = 6;
  string comprador_email     = 7;
  int64  precio_centavos     = 8;
  int32  capacidad_maxima    = 9;
  int32  usadas              = 10;
  string codigo_acceso       = 11;
  string created_at          = 12;
}

message AdminListLicenciasEmpresasResponse {
  repeated AdminLicenciaEmpresa licencias = 1;
  int32 total_licencias = 2;
  int32 total_asientos  = 3;
  int32 asientos_usados = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Relleno del histórico de comisiones
// ─────────────────────────────────────────────────────────────────────────────

message ListOrdenesSinComisionRequest {
  int32 limite = 1;
}

message OrdenSinComision {
  string id                    = 1;
  string stripe_payment_intent = 2;
}

message ListOrdenesSinComisionResponse {
  repeated OrdenSinComision ordenes = 1;
  // Cuántas quedan en total, para poder informar del avance.
  int32 restantes = 2;
}

message RegistrarComisionOrdenRequest {
  string orden_id              = 1;
  int64  comision_centavos     = 2;
  int64  neto_centavos         = 3;
  string balance_transaction_id = 4;
}
