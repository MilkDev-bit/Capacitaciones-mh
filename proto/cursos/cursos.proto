syntax = "proto3";

package cursos;

option go_package = "Prueba-Go/gen/cursos;cursospb";

// ─────────────────────────────────────────────────────────────────────────────
// CursosService: gestión de capacitaciones, inscripciones y asignaciones.
// ─────────────────────────────────────────────────────────────────────────────
service CursosService {
  // ── Público ──────────────────────────────────────────────────────────────
  rpc PreviewCurso(CodigoRequest) returns (CursoResponse);
  rpc GetCursoPublico(CursoIDRequest) returns (CursoResponse);
  rpc ListCursosPublicos(EmptyRequest) returns (ListCursosResponse);

  // ── Usuario autenticado ───────────────────────────────────────────────────
  rpc ListMisCapacitaciones(UserRequest) returns (ListCursosResponse);
  rpc GetCurso(CursoIDRequest) returns (CursoResponse);
  rpc Inscribirse(InscribirseRequest) returns (EmptyResponse);
  rpc UnirseConCodigo(UnirseRequest) returns (EmptyResponse);
  rpc UnirseConLicencia(UnirseConLicenciaRequest) returns (EmptyResponse);
  // Los webhooks devuelven el detalle de lo comprado (no EmptyResponse) porque
  // el Gateway necesita esos datos para construir el correo de confirmación y
  // la pantalla de éxito sin hacer una segunda ronda de consultas.
  rpc WebhookEnroll(WebhookEnrollRequest) returns (EnrollResponse);
  rpc WebhookComprarLicencia(WebhookComprarLicenciaRequest) returns (EmptyResponse);
  rpc WebhookComprarB2BDirect(WebhookComprarB2BDirectRequest) returns (ComprarB2BDirectResponse);

  // Reparto de accesos corporativos por correo.
  rpc AsignarAccesosLicencia(AsignarAccesosLicenciaRequest) returns (AsignarAccesosLicenciaResponse);
  rpc ListInvitacionesLicencia(LicenciaIDRequest) returns (ListInvitacionesLicenciaResponse);

  // Registra que un participante terminó el curso y decide si toca avisar al
  // representante de su licencia para que tramite las constancias DC-3.
  // La deduplicación vive en la BD: solo devuelve avisar=true la primera vez.
  rpc NotificarCursoCompletado(CursoCompletadoRequest) returns (CursoCompletadoResponse);
  // Deduplicación de webhooks de Stripe. Devuelve primera_vez=false si el
  // evento ya se había procesado: la entrega es al-menos-una-vez.
  rpc RegistrarEventoStripe(EventoStripeRequest) returns (EventoStripeResponse);
  // Transición de estado de una orden tras el resultado del cobro.
  rpc ActualizarEstadoOrden(ActualizarEstadoOrdenRequest) returns (EmptyResponse);

  // ── Suscripciones ─────────────────────────────────────────────────────────
  rpc ListPlanes(EmptyRequest) returns (ListPlanesResponse);
  rpc GetMiSuscripcion(UserRequest) returns (SuscripcionResponse);
  rpc CrearCheckoutSuscripcion(CheckoutSuscripcionRequest) returns (CheckoutSessionResponse);
  // Aplica el estado que reporta Stripe. Nunca se infiere localmente: el
  // ciclo de vida lo manda el PSP.
  rpc SincronizarSuscripcion(SincronizarSuscripcionRequest) returns (EmptyResponse);
  rpc RegistrarFacturaSuscripcion(FacturaSuscripcionRequest) returns (EmptyResponse);
  // Acceso derivado de una suscripción viva (titular o asiento ocupado).
  rpc TieneAccesoPorSuscripcion(UserRequest) returns (AccesoSuscripcionResponse);
  rpc AsignarAsientos(AsignarAsientosRequest) returns (ListAsientosResponse);
  rpc ListAsientos(SuscripcionIDRequest) returns (ListAsientosResponse);
  rpc RevocarAsiento(RevocarAsientoRequest) returns (EmptyResponse);

  rpc CreateCheckoutSession(CheckoutSessionRequest) returns (CheckoutSessionResponse);
  rpc CreateCheckoutSessionB2BDirect(CreateCheckoutSessionB2BDirectRequest) returns (CheckoutSessionResponse);
  rpc CreateCheckoutSessionCart(CheckoutCartRequest) returns (CheckoutSessionResponse);
  rpc ListLicencias(ListLicenciasRequest) returns (ListLicenciasResponse);
  rpc GetLicenciaPublica(LicenciaIDRequest) returns (LicenciaPublicaResponse);
  rpc ListLicenciasCompradas(UserRequest) returns (ListLicenciasResponse);

  // ── Instructor ────────────────────────────────────────────────────────────
  rpc InstructorListCapacitaciones(UserRequest) returns (ListCursosResponse);
  rpc InstructorCreateCapacitacion(CreateCursoRequest) returns (CursoResponse);
  rpc InstructorUpdateCapacitacion(UpdateCursoRequest) returns (CursoResponse);
  rpc InstructorDeleteCapacitacion(CursoIDRequest) returns (EmptyResponse);
  rpc InstructorTogglePublic(CursoIDRequest) returns (CursoResponse);
  rpc InstructorResetCodigo(CursoIDRequest) returns (CursoResponse);
  rpc InstructorListEstudiantes(UserRequest) returns (ListEstudiantesResponse);
  rpc InstructorAsignar(AsignarRequest) returns (EmptyResponse);
  
  rpc InstructorCreateLicencia(CreateLicenciaRequest) returns (Licencia);
  rpc InstructorUpdateLicencia(UpdateLicenciaRequest) returns (Licencia);
  rpc InstructorDeleteLicencia(LicenciaIDRequest) returns (EmptyResponse);

  // ── Admin ─────────────────────────────────────────────────────────────────
  rpc AdminListCapacitaciones(EmptyRequest) returns (ListCursosResponse);
  rpc AdminCreateCapacitacion(CreateCursoRequest) returns (CursoResponse);
  rpc AdminUpdateCapacitacion(UpdateCursoRequest) returns (CursoResponse);
  rpc AdminDeleteCapacitacion(CursoIDRequest) returns (EmptyResponse);
  rpc AdminResetCodigo(CursoIDRequest) returns (CursoResponse);
  rpc AdminListAsignaciones(EmptyRequest) returns (ListAsignacionesResponse);
  rpc AdminAsignar(AsignarRequest) returns (EmptyResponse);
  rpc AdminDesAsignar(AsignacionIDRequest) returns (EmptyResponse);

  // Obtiene estadísticas del dashboard de ventas y ganancias (solo admin)
  rpc GetAdminDashboardStats(EmptyRequest) returns (AdminDashboardStatsResponse);
}

// ── Requests ─────────────────────────────────────────────────────────────────

message EmptyRequest  {}
message UserRequest   { string user_id = 1; }
message CursoIDRequest {
  string curso_id = 1;
  string user_id = 2;
}
message CodigoRequest { string codigo = 1; }
message AsignacionIDRequest { string asignacion_id = 1; }

message CreateCursoRequest {
  string user_id         = 1; // instructor o admin que lo crea
  string title           = 2;
  string description     = 3;
  string type            = 4;
  string content         = 5;
  string file_path       = 6;
  bool   is_public       = 7;
  string welcome_message = 8;
  string thumbnail_url   = 9;
  string color           = 10;
  double precio          = 11;
  string scheduled_at    = 12;
  int32  duration        = 13;
  bool   dc3_enabled     = 14;
}

message UpdateCursoRequest {
  string curso_id        = 1;
  string user_id         = 2;
  string title           = 3;
  string description     = 4;
  string type            = 5;
  string content         = 6;
  string file_path       = 7;
  bool   is_public       = 8;
  string welcome_message = 9;
  string thumbnail_url   = 10;
  string color           = 11;
  double precio          = 12;
  string scheduled_at    = 13;
  int32  duration        = 15;
  bool   dc3_enabled     = 16;
}

message InscribirseRequest {
  string user_id  = 1;
  string curso_id = 2;
}

message UnirseRequest {
  string user_id = 1;
  string codigo  = 2;
}

message AsignarRequest {
  string requester_id     = 1; // quien asigna (instructor o admin)
  string target_user_id   = 2;
  string capacitacion_id  = 3;
  string examen_id        = 4;
}

// ── Responses ────────────────────────────────────────────────────────────────

message CursoResponse {
  string id              = 1;
  string title           = 2;
  string description     = 3;
  string type            = 4;
  string file_path       = 5;
  string content         = 6;
  string instructor_id   = 7;
  bool   is_public       = 8;
  string codigo_acceso   = 9;
  string welcome_message = 10;
  string thumbnail_url   = 11;
  string color           = 12;
  string created_at      = 13;
  double precio          = 14;
  string scheduled_at    = 15;
  int32  duration        = 17;
  int32  total_lecciones = 18;
  int32  lecciones_completadas = 19;
  bool   dc3_enabled     = 20;
}

message ListCursosResponse {
  repeated CursoResponse cursos = 1;
}

message EstudianteInfo {
  string user_id    = 1;
  string name       = 2;
  string email      = 3;
  string assigned_at = 4;
}

message ListEstudiantesResponse {
  repeated EstudianteInfo estudiantes = 1;
}

message AsignacionInfo {
  string id              = 1;
  string user_id         = 2;
  string user_name       = 3;
  string capacitacion_id = 4;
  string examen_id       = 5;
  string assigned_at     = 6;
}

message ListAsignacionesResponse {
  repeated AsignacionInfo asignaciones = 1;
}

message EmptyResponse {}

message Licencia {
  string id = 1;
  string capacitacion_id = 2;
  string nombre = 3;
  double precio = 4;
  int32 capacidad_maxima = 5;
  int32 usadas = 6;
  string codigo_acceso = 7;
  string stripe_product_id = 8;
  string stripe_price_id = 9;
  string comprador_id = 10;
  string created_at = 11;
  string curso_type = 12;
  int32 curso_duracion = 13;
  // Título de la capacitación asociada — evita que el frontend haga N+1 fetches.
  string capacitacion_titulo = 14;
  // Accesos ya repartidos por correo (invitaciones enviadas).
  int32 accesos_enviados = 15;
}

message LicenciaPublicaResponse {
  string id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
  string capacitacion_id = 5;
  string capacitacion_titulo = 6;
  string capacitacion_thumbnail = 7;
}

message CreateLicenciaRequest {
  string capacitacion_id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
  string instructor_id = 5; // used to auto-add as group admin
}

message UpdateLicenciaRequest {
  string id = 1;
  string nombre = 2;
  double precio = 3;
  int32 capacidad_maxima = 4;
}

message LicenciaIDRequest {
  string id = 1;
}

message ListLicenciasRequest {
  string capacitacion_id = 1;
}

message ListLicenciasResponse {
  repeated Licencia licencias = 1;
}

message UnirseConLicenciaRequest {
  string user_id = 1;
  string capacitacion_id = 2;
  string codigo_acceso = 3;
}

message WebhookEnrollRequest {
  string user_id = 1;
  string capacitacion_id = 2;
  string licencia_id = 3;
}

message CartItem {
  string curso_id = 1;
  int32 cantidad = 2;
  string type = 3; // "b2c" | "b2b_direct"
}

message CheckoutCartRequest {
  string user_id = 1;
  repeated CartItem items = 2;
  string success_url = 3;
  string cancel_url = 4;
}

message WebhookComprarLicenciaRequest {
  string user_id = 1;
  string licencia_id = 2;
}

message CheckoutSessionRequest {
  string user_id = 1;
  string licencia_id = 2; // optional, used for B2B payment flow (if still supported)
  string success_url = 3;
  string cancel_url = 4;
  string curso_id = 5; // optional, used for individual B2C course purchase
}

message CheckoutSessionResponse {
  string url = 1;
  // Id de la orden creada antes de redirigir a Stripe. Permite rastrear el
  // intento de cobro aunque el usuario nunca vuelva.
  string orden_id = 2;
}

// ── Suscripciones ────────────────────────────────────────────────────────────

message Plan {
  string id              = 1;
  string codigo          = 2;
  string nombre          = 3;
  string descripcion     = 4;
  string modalidad       = 5;  // "individual" | "asientos"
  string intervalo       = 6;  // "mes" | "anio"
  int64  precio_centavos = 7;  // por asiento cuando modalidad="asientos"
  string moneda          = 8;
  int32  dias_prueba     = 9;
  bool   activo          = 10;
}

message ListPlanesResponse {
  repeated Plan planes = 1;
}

message SuscripcionResponse {
  string id         = 1;
  string plan_id    = 2;
  string plan_nombre = 3;
  string modalidad  = 4;
  string intervalo  = 5;
  int64  precio_centavos = 6;
  // incompleta | en_prueba | activa | vencida | cancelada | impagada
  string estado     = 7;
  int32  asientos   = 8;
  int32  asientos_ocupados = 9;
  string periodo_inicio = 10;
  string periodo_fin    = 11;
  string prueba_fin     = 12;
  bool   cancelar_al_terminar = 13;
  // true mientras el acceso siga vivo, incluido el periodo de gracia.
  bool   acceso_vigente = 14;
  // Necesario para abrir el Billing Portal. El Gateway NO lo reenvía al
  // navegador: se usa solo para firmar la sesión del portal.
  string stripe_customer_id = 15;
}

message CheckoutSuscripcionRequest {
  string user_id     = 1;
  string plan_codigo = 2;
  int32  asientos    = 3;
  string success_url = 4;
  string cancel_url  = 5;
}

message SincronizarSuscripcionRequest {
  string stripe_subscription_id = 1;
  string stripe_customer_id     = 2;
  string user_id                = 3;  // solo en el alta inicial
  string plan_codigo            = 4;  // solo en el alta inicial
  string estado                 = 5;  // estado ya traducido desde Stripe
  int32  asientos               = 6;
  string periodo_inicio         = 7;  // RFC3339
  string periodo_fin            = 8;
  string prueba_fin             = 9;
  bool   cancelar_al_terminar   = 10;
}

message FacturaSuscripcionRequest {
  string stripe_subscription_id = 1;
  string stripe_invoice_id      = 2;
  string estado                 = 3;  // pagada | fallida | abierta
  int64  total_centavos         = 4;
  string moneda                 = 5;
  int32  intento_cobro          = 6;
  string url_pdf                = 7;
  string periodo_inicio         = 8;
  string periodo_fin            = 9;
}

message AccesoSuscripcionResponse {
  bool   tiene_acceso   = 1;
  string origen         = 2;  // "titular" | "asiento" | ""
  string suscripcion_id = 3;
  string estado         = 4;
}

message ParticipanteAsiento {
  string nombre = 1;
  string email  = 2;
}

message AsignarAsientosRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
  repeated ParticipanteAsiento participantes = 3;
}

message SuscripcionIDRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
}

message RevocarAsientoRequest {
  string suscripcion_id = 1;
  string titular_id     = 2;
  string email          = 3;
}

message Asiento {
  string id     = 1;
  string email  = 2;
  string user_id = 3;
  string estado = 4;  // invitado | activo | revocado
  string invitado_at = 5;
}

message ListAsientosResponse {
  repeated Asiento asientos = 1;
  int32 total     = 2;
  int32 ocupados  = 3;
  int32 libres    = 4;
}

// ── Órdenes y webhooks ───────────────────────────────────────────────────────

message EventoStripeRequest {
  string event_id = 1;
  string tipo     = 2;
}

message EventoStripeResponse {
  // false cuando el evento ya estaba registrado (reenvío de Stripe).
  bool primera_vez = 1;
}

message ActualizarEstadoOrdenRequest {
  string stripe_session_id     = 1;
  string estado                = 2; // 'pagada' | 'cumplida' | 'fallida'
  string motivo_fallo          = 3;
  string stripe_payment_intent = 4;
}

message AdminDashboardStatsResponse {
  float total_ventas_brutas = 1;
  float total_ventas_netas = 2; // Brutas descontando tarifas Stripe aproximadas (3.6% + 3 MXN)
  int32 total_transacciones = 3;
  int32 licencias_vendidas = 4;
  int32 compras_individuales = 5;
}

message CreateCheckoutSessionB2BDirectRequest {
  string user_id = 1;
  string curso_id = 2;
  int32 cantidad = 3;
  string success_url = 4;
  string cancel_url = 5;
}

message WebhookComprarB2BDirectRequest {
  string user_id = 1;
  string curso_id = 2;
  int32 cantidad = 3;
}


// ── Resultado de una compra (para correo de confirmación y pantalla de éxito) ─

message EnrollResponse {
  string capacitacion_id     = 1;
  string capacitacion_titulo = 2;
  string capacitacion_type   = 3; // "video" | "document" | "text" | "link"
}

message ComprarB2BDirectResponse {
  string licencia_id         = 1;
  string capacitacion_id     = 2;
  string capacitacion_titulo = 3;
  string capacitacion_type   = 4;
  // codigo_acceso se usa en cursos asíncronos (un código compartido).
  string codigo_acceso       = 5;
  int32  lugares             = 6;
  double total               = 7;
}

// ── Reparto de accesos a participantes ───────────────────────────────────────

message ParticipanteInput {
  string nombre = 1;
  string email  = 2;
}

message AsignarAccesosLicenciaRequest {
  string licencia_id  = 1;
  string comprador_id = 2; // se valida contra curso_licencias.comprador_id
  repeated ParticipanteInput participantes = 3;
}

message AccesoParticipante {
  string nombre              = 1;
  string email               = 2;
  string codigo              = 3;
  string capacitacion_id     = 4;
  string capacitacion_titulo = 5;
  string capacitacion_type   = 6;
}

message AsignarAccesosLicenciaResponse {
  repeated AccesoParticipante accesos = 1;
}

message InvitacionLicencia {
  string id          = 1;
  string licencia_id = 2;
  string nombre      = 3;
  string email       = 4;
  string codigo      = 5;
  string estado      = 6; // "enviado" | "usado"
  string enviado_at  = 7;
}

message ListInvitacionesLicenciaResponse {
  repeated InvitacionLicencia invitaciones = 1;
}

// ── Aviso DC-3 al representante ──────────────────────────────────────────────

message CursoCompletadoRequest {
  string user_id         = 1;
  string capacitacion_id = 2;
}

message CursoCompletadoResponse {
  // false cuando no aplica: compra individual sin licencia, curso con DC-3
  // desactivado, o aviso ya enviado antes.
  bool   avisar              = 1;
  string representante_id    = 2;
  string capacitacion_titulo = 3;
  int32  duracion_minutos    = 4;
}













